<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा AI चैटबॉट</title>
    <style>
        /* डिज़ाइन को सुंदर बनाने के लिए CSS */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        .chat-header { background: #007bff; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .chat-box { height: 300px; overflow-y: auto; padding: 15px; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 15px; max-width: 80%; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; }
        .ai-msg { background: #e9e9eb; color: #333; align-self: flex-start; }
        .input-area { display: flex; padding: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; margin-left: 5px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">कोडिंग पार्टनर AI</div>
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">नमस्ते! मैं आपकी कैसे मदद कर सकता हूँ?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="यहाँ लिखें...">
        <button onclick="sendMessage()">भेजें</button>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");

        if (input.value.trim() === "") return;

        // यूज़र का मैसेज दिखाएं
        const userDiv = document.createElement("div");
        userDiv.className = "message user-msg";
        userDiv.textContent = input.value;
        chatBox.appendChild(userDiv);

        // AI का जवाब (अभी के लिए यह एक डमी रिस्पॉन्स है)
        setTimeout(() => {
            const aiDiv = document.createElement("div");
            aiDiv.className = "message ai-msg";
            aiDiv.textContent = "आपका संदेश मिल गया! असली AI जोड़ने के लिए हमें API की ज़रूरत होगी।";
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // नीचे स्क्रॉल करें
        }, 1000);

        input.value = ""; // इनपुट साफ़ करें
    }
</script>

</body>
</html>

    </div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>

            <li><button id="bluetooth-sim-btn" class="nav-btn" style="display: none;">BT Broadcast</button></li>
        </ul>
    </nav>
</header>

<main>
    <section class="hero">
        <h2>Contact Us</h2>
        <p>Get in touch with Aman Meena and the _technical_01 team.</p>

        <div class="contact-links" style="margin-top: 2rem;">
            <a href="mailto:contact@technical01.com" class="btn btn-primary"><i class="fas fa-envelope"></i> Email Us</a>
            <a href="https://www.instagram.com/_technical_01?igsh=MTdydjJkbWl3Y3ppeg==" target="_blank" class="btn btn-instagram"><i class="fab fa-instagram"></i> Instagram DM</a>
            <a href="https://whatsapp.com/channel/0029VaDFCbF9hXFDBUx8fe3E" target="_blank" class="btn btn-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        </div>
    </section>

    <section class="content-container">
        <h3>Send us a Message</h3>
        <form class="contact-form" action="#" method="POST" onsubmit="alert('Thank you for your message! We will get back to you soon.'); return false;">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your Name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Your Email">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required placeholder="Your Message"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </section>
</main>
